<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F190F" />
      <stop offset="100%" stop-color="#090807" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#784E0F" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Inner Gold Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Center Gold Emblem: Meat / BBQ / Lao 'ຄ' -->
  <g filter="url(#goldGlow)">
    <text x="256" y="320" font-family="'Noto Sans Lao', 'Phetsarath OT', sans-serif" font-size="220" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">ຄ</text>
  </g>

  <!-- Star accents -->
  <circle cx="256" cy="100" r="8" fill="#FDE68A" />
  <circle cx="100" cy="256" r="8" fill="#FDE68A" />
  <circle cx="412" cy="256" r="8" fill="#FDE68A" />
  <circle cx="256" cy="412" r="8" fill="#FDE68A" />
</svg>
